  ros2_pcd_publisher:
    image: gearbox-cell51-ros2_pcd_publisher
    build:
      context: ./docker/pickit-sim-camera-bridge
      dockerfile: Dockerfile
    container_name: ros2_pcd_publisher
    networks:
      - ci_net
    ipc: host
    environment:
      <<: *ros2-fastdds-env
      ROS_DISTRO: jazzy
      WORKSPACE_DIR: /mounted_folder/pcd_converter_ws
      PACKAGE_NAME: pcd_converter
      LAUNCH_FILE: zivid_pcd_launch.launch.py
      DOWNSAMPLE_FACTOR: ${DOWNSAMPLE_FACTOR:-4}
      PUBLISH_HZ: ${PUBLISH_HZ:-0.5}
    volumes:
      - ./config/fastdds.xml:/config/fastdds.xml:ro
      - ./docker/pcd_converter/mounted_folder:/mounted_folder:rw
    entrypoint:
      - /bin/bash
      - /mounted_folder/run_zivid_pcd.sh
    restart: unless-stopped

  zenoh-bridge:
    image: cypress/zenoh-bridge-ros2dds:1.9.0-route-lifetime
    build:
      context: .
      dockerfile: docker/zenoh/Dockerfile
    container_name: zenoh_bridge_connector
    networks:
      - ci_net
    ipc: host
    restart: unless-stopped
    environment:
      <<: *ros2-fastdds-env
      ROS_DISTRO: jazzy
      RUST_LOG: debug
    volumes:
      - ./config/fastdds.xml:/config/fastdds.xml:ro
      - ./docker/pickit-sim-camera-bridge/config/zenoh_config.json5:/zenoh_config.json5:ro
    command:
      - --config
      - /zenoh_config.json5
      - --connect
      - tcp/${PICKIT_ROS2_IP:-192.168.66.1}:7447
    depends_on:
      ros2_pcd_publisher:
        condition: service_started

networks:
  ci_net:
    external: true
    name: ci_net
