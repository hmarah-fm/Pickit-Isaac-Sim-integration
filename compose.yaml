name: gearbox-cell51

# Import services dynamically from the pcd_converter submodule compose file.
include:
  - path: ./docker/pickit-sim-camera-bridge/docker-compose.yaml

x-ros2-fastdds-env: &ros2-fastdds-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-28}
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST # LOCALHOST vs SUBNET Refer to README.md, dockerised vs native isaac sim
  FASTRTPS_DEFAULT_PROFILES_FILE: /config/fastdds.xml
  FASTDDS_DEFAULT_PROFILES_FILE: /config/fastdds.xml

x-isaac-pcd-image: &isaac-pcd-image
  image: gearbox/isaac-sim-pcd-jazzy:5.1.0
  build:
    context: .
    dockerfile: docker/isaacsim51/Dockerfile

services:
  isaac-sim:
    <<: *isaac-pcd-image
    container_name: gearbox51_isaac_sim
    user: "0:0"
    network_mode: host
    ipc: host
    runtime: nvidia
    gpus: all
    stop_grace_period: 30s
    environment:
      <<: *ros2-fastdds-env
      ACCEPT_EULA: "Y"
      OMNI_ENV_PRIVACY_CONSENT: "Y"
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ./isaacsim_workspace:/isaacsim_workspace:rw
      - ./config/fastdds.xml:/config/fastdds.xml:ro
      - ${ISAAC_CACHE_DIR}/main:/root/.cache/ov:rw
      - ${ISAAC_CACHE_DIR}/computecache:/root/.nv/ComputeCache:rw
      - ${ISAAC_DATA_DIR}/logs:/root/.nvidia-omniverse/logs:rw
      - ${ISAAC_DATA_DIR}/config:/root/.nvidia-omniverse/config:rw
      - ${ISAAC_DATA_DIR}/data:/root/.local/share/ov/data:rw
      - ${ISAAC_DATA_DIR}/pkg:/root/.local/share/ov/pkg:rw
    entrypoint: ["/opt/gearbox/launch-isaac-jazzy.sh"]
    command:
      - --enable
      - isaacsim.ros2.bridge
      - --/app/file=/isaacsim_workspace/scenes/gearbox_disassembly.usda     # replace with your scene

  # --- OVERRIDE: Zivid/Isaac RGB+XYZ -> Pickit virtual camera bridge ---
  #
  # The following services are defined in docker/pickit-sim-camera-bridge/docker-compose.yaml and
  # overridden here. The bind mount contains:
  #
  # /mounted_folder/
  # ├── run_zivid_pcd.sh
  # └── pcd_converter_ws/
  #     ├── src/pcd_converter/
  #     ├── build/
  #     ├── install/
  #     └── log/
  #
  # run_zivid_pcd.sh:
  #   1. Sources /opt/ros/jazzy/setup.bash.
  #   2. Sources pcd_converter_ws/install/setup.bash if present.
  #   3. Checks: ros2 pkg prefix pcd_converter.
  #   4. Builds only if the package is not discoverable.
  #   5. Launches: ros2 launch pcd_converter zivid_pcd_launch.launch.py.
  
  ros2_pcd_publisher:
    environment:
      <<: *ros2-fastdds-env
      ROS_DISTRO: jazzy
      WORKSPACE_DIR: /mounted_folder/pcd_converter_ws
      PACKAGE_NAME: pcd_converter
      LAUNCH_FILE: zivid_pcd_launch.launch.py

    volumes:
      - ./config/fastdds.xml:/config/fastdds.xml:ro

      # Mount the workspace, launch file, bridge node, and startup script together.
      # Keep this read-write because colcon writes build/, install/, and log/.
      - ./docker/pcd_converter/mounted_folder:/mounted_folder:rw

    # Override any submodule image entrypoint so this container always follows
    # the self-build / self-launch workflow.
    entrypoint:
      - /bin/bash
      - /mounted_folder/run_zivid_pcd.sh

    # Do not set a command here. Any additional values passed to this service
    # would otherwise become launch arguments after the script name.

    restart: unless-stopped

    depends_on:
      isaac-sim:
        condition: service_started

  zenoh-bridge:
    environment:
      <<: *ros2-fastdds-env
    depends_on:
      ros2_pcd_publisher:
        condition: service_started
